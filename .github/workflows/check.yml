name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash  # explicit bash runs with -eo pipefail, so a failing pipe stage fails the step

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false  # nothing here pushes, so keep the token out of .git
      - name: Run everything make check covers
        run: make check
