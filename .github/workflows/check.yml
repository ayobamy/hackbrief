name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash  # explicit bash runs with -eo pipefail, so a failing pipe stage fails the step

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The same Postgres as compose.yaml, on the same host port, for the database tests.
      db:
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: hackr
          POSTGRES_PASSWORD: hackr
          POSTGRES_DB: hackr_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hackr -d hackr_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # The service's only database is the test one: make check runs no other database work.
      DATABASE_URL: postgres://hackr:hackr@localhost:5433/hackr_test
      TEST_DATABASE_URL: postgres://hackr:hackr@localhost:5433/hackr_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes, so keep the token out of .git
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0, reads packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies from the lockfile
        run: make install
      - name: Run everything make check covers
        run: make check
