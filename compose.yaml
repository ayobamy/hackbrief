# Postgres for local development and the database tests: `make db-up`, then `make check`.
# Same major version as the Neon database in production (18).
# The password is for this local container only, which listens on 127.0.0.1. Hosted databases
# (Neon) take their URL from DATABASE_URL in .env, never from this file.
services:
  db:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: hackr
      POSTGRES_PASSWORD: hackr
      POSTGRES_DB: hackr
    ports:
      # 5433 on the host, so it does not clash with a Postgres already installed on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      # From Postgres 18 the image keeps its data under /var/lib/postgresql/18/docker and expects
      # the volume one level up, at /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackr -d hackr"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
